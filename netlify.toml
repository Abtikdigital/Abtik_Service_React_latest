[build]
  command = "npm run build"
  publish = ".next"

# Force non-www for custom domain
[[redirects]]
  from = "https://www.abtikservices.com/*"
  to = "https://abtikservices.com/:splat"
  status = 301
  force = true

# Force non-www for Netlify deploy URL
[[redirects]]
  from = "https://www.exquisite-pixie-f377e3.netlify.app/*"
  to = "https://exquisite-pixie-f377e3.netlify.app/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/stratup-india-registration/"
  to = "/startup-india-registration"
  status = 301

[[redirects]]
  from = "/services/funding/seed-fund"
  to = "/startup-india-seed-fund"
  status = 301

[[redirects]]
  from = "/services/registration/private-limited"
  to = "/registration"
  status = 301

[[redirects]]
  from = "/services/certificate/startup-india"
  to = "/startup-india-registration"
  status = 301

[[redirects]]
  from = "/services/certificate/tax-exemption-certificate"
  to = "/startup-india-certification"
  status = 301

[[redirects]]
  from = "/services/certificate/fssai-licence"
  to = "/fssai-registration"
  status = 301

[[redirects]]
  from = "/services/funding/grants"
  to = "/government-grants-funding"
  status = 301

[[redirects]]
  from = "/legal/privacy-policy"
  to = "/privacy-policy"
  status = 301

# Next.js handles its own routing, so we don't need the /* /index.html 200 fallback.

[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

[build.processing.images]
  compress = true

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true
